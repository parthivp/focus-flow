<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#48dbfb"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round"
    stroke-dasharray="880 220" transform="rotate(-90 256 256)" filter="url(#glow)" opacity="0.9"/>

  <!-- Track ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#2a2a4a" stroke-width="12" opacity="0.5"/>

  <!-- Progress ring (3/4 filled) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
    stroke-dasharray="825 275" transform="rotate(-90 256 256)"/>

  <!-- Center play triangle -->
  <polygon points="232,196 232,316 332,256" fill="url(#inner)" filter="url(#innerGlow)"/>

  <!-- Small accent dots -->
  <circle cx="256" cy="60" r="8" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="256" cy="452" r="6" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="60" cy="256" r="6" fill="#a78bfa" opacity="0.6"/>
  <circle cx="452" cy="256" r="8" fill="#feca57" opacity="0.8"/>
</svg>
